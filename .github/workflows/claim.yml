name: Claim Free Games

on:
  # Run every Thursday at 17:00 UTC (Epic updates around 16:00 UTC on Thursdays)
  schedule:
    - cron: '0 17 * * 4'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - name: Install Playwright Firefox
        run: PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000 npx playwright install firefox --with-deps

      - name: Claim free games
        env:
          EG_EMAIL: ${{ secrets.EG_EMAIL }}
          EG_PASSWORD: ${{ secrets.EG_PASSWORD }}
          EG_OTPKEY: ${{ secrets.EG_OTPKEY }}
          EG_PARENTALPIN: ${{ secrets.EG_PARENTALPIN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          HEADLESS: '1'
        run: node src/index.js --claim

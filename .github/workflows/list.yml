name: List Free Games

on:
  # Run every Thursday at 16:30 UTC (before claim workflow)
  schedule:
    - cron: '30 16 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - name: List free games
        run: node src/index.js --list --json
